<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bshara Eats</title>
    <style>
        body {
            background: radial-gradient(circle, #1a1a1a, #000);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .logo {
            font-size: 55px; font-weight: 900; color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 15px; text-transform: uppercase;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px 60px; border-radius: 30px; text-align: center;
        }
        .nav-dots { position: fixed; bottom: 45px; display: flex; gap: 22px; }
        .dot {
            width: 12px; height: 12px; background: #ffffff; border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="logo">Bshara Eats</div>
    <div class="glass-card">
        <h2 style="margin: 0; font-weight: 300;">Premium Delivery</h2>
        <p style="opacity: 0.6; margin-top: 10px; letter-spacing: 2px;">COMING SOON</p>
    </div>
    <div class="nav-dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
</body>
</html>
